# DEMO #10 - CI/CD  ·  BOZUK BASLANGIC WORKFLOW'U
# Bu dosya KASITLI olarak hatalidir. Egitmen, Copilot'a "@workspace bu workflow neden
# calismaz? Bul ve duzelt" diyerek hatalari canli buldurur ve duzelttirir.
#
# BILINEN HATALAR (egitmen cevap anahtari - ANSWER-KEY/.github/workflows/ci.yml):
#   1) 'on' tetikleyicisi yanlis girintilenmis / eksik.
#   2) actions/checkout surumu cok eski ve yanlis yazilmis (chekout).
#   3) setup-dotnet'e dotnet-version verilmemis.
#   4) Proje yolu yanlis (src yok).
#   5) 'run' yerine yanlis anahtar kullanilmis.
#   6) test adimi restore/build'e bagimli degil, sirasi hatali.

name: CI

on
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/chekout@v1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Restore
        run: dotnet restore PriceApi.sln

      - name: Test
        uses: dotnet test --no-build

      - name: Build
        run: dotnet build PriceApi/PriceApi.csproj
