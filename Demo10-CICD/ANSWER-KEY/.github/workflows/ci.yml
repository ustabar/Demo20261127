# DEMO #10 - CI/CD  ·  CEVAP ANAHTARI (Duzeltilmis CI Workflow)
# Copilot'un uretmesi/duzeltmesi beklenen dogru surum.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/PriceApi.Tests/PriceApi.Tests.csproj

      - name: Build
        run: dotnet build src/PriceApi.Tests/PriceApi.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test src/PriceApi.Tests/PriceApi.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
